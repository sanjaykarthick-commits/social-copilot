# Just a local Postgres for the demo and development: `docker compose up -d db`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sc
      POSTGRES_PASSWORD: sc
      POSTGRES_DB: social_copilot
    ports:
      - "5432:5432"
    volumes:
      - sc-pg:/var/lib/postgresql/data
volumes:
  sc-pg:
